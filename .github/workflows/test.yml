name: テスト

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # git のバージョン差で出力形式が変わっていないかを検知する。
        include:
          - name: ubuntu (git 2.4x)
            container: ""
          - name: alpine/git (git 2.5x)
            container: alpine/git:latest
    name: ${{ matrix.name }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v7
      - name: 依存を用意
        run: |
          if command -v apk >/dev/null; then
            # alpine は musl なので actions/setup-python が使えない。
            # py3-pytest を直接入れれば venv + pip の往復が丸ごと要らなくなる
            # （ローカルの run-tests-docker.sh と同じ形。実測 6.5s -> 2.0s）
            apk add --quiet python3 py3-pytest
          else
            python3 -m venv /tmp/venv
            /tmp/venv/bin/pip install -q pytest
          fi
          git --version
          git config --global --add safe.directory '*'
      - name: pytest
        run: |
          PY=/tmp/venv/bin/python
          [ -x "$PY" ] || PY=python3
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 "$PY" -m pytest -q

  viewer:
    runs-on: ubuntu-latest
    name: ビューアのスモークテスト
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: node --check docs/app.js
      - run: node tools/smoke.mjs
