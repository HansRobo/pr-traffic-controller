name: 解析

# 解析対象はワークフローにもリポジトリにも埋め込まない。
#
#   Run workflow でリポジトリを指定 -> 解析して結果を蓄積
#   定期実行                        -> 蓄積されている全件を再解析
#
# 解析結果は **Actions のキャッシュ** に置き、git にはコミットしない。
# サイトはキャッシュの内容を含めて Pages へ直接デプロイする
# （リポジトリの履歴が解析結果の更新で埋まらないようにするため）。
#
# Pages の設定: Settings → Pages → Source を「GitHub Actions」にすること。

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 解析するリポジトリ（owner/name）。空なら蓄積済みを全件更新して再デプロイ
        required: false
      lines:
        description: 統合ブランチ（カンマ区切り）。分岐した統合先が複数あれば全て挙げる
        required: false
        default: main
      include_forks:
        description: フォーク側の PR も含める
        type: boolean
        default: true
      forget:
        description: 指定したリポジトリを蓄積から削除する（解析はしない）
        type: boolean
        default: false
  schedule:
    # 6時間ごとに蓄積済みの全リポジトリを更新する。
    # キャッシュは 7 日アクセスが無いと退避されるので、この頻度なら保たれる。
    - cron: "0 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: analyze
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: git のバージョンを確認
        # merge-tree --write-tree -z が要る。古い git だと衝突を
        # 正しく検出できないため、ここで落とす。
        run: |
          git --version
          python3 - <<'PY'
          import re, subprocess, sys
          out = subprocess.run(["git","--version"],capture_output=True,text=True).stdout
          v = tuple(int(x) for x in re.search(r"(\d+)\.(\d+)", out).groups())
          if v < (2, 40):
              sys.exit(f"git >= 2.40 が必要です (検出: {v})")
          print(f"OK: git {v}")
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 蓄積済みの解析結果を復元する。キーは実行ごとに変え、restore-keys で
      # 直近のものを拾う（同じキーには保存し直せないため）。
      - name: 解析結果を復元
        uses: actions/cache/restore@v4
        with:
          path: docs/data
          key: analysis-${{ github.run_id }}
          restore-keys: analysis-

      - name: 復元された対象を表示
        run: |
          if [ -f docs/data/index.json ]; then
            python3 -c "
          import json
          d = json.load(open('docs/data/index.json'))
          print('蓄積済み:', ', '.join(a['repo'] for a in d['analyses']) or '(なし)')
          "
          else
            echo "蓄積なし（初回、またはキャッシュが退避された）"
          fi

      - name: 解析を実行
        id: analyze
        # 1 つの対象が失敗しても、残りの結果はデプロイする。
        # ここで止めると、無関係なリポジトリの解析まで古いままになる。
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.forget }}" = "true" ]; then
            python -m analyzer.analyze --forget "${{ inputs.repo }}" --outdir docs/data
          elif [ -z "${{ inputs.repo }}" ]; then
            python -m analyzer.analyze --refresh --outdir docs/data
          else
            python -m analyzer.analyze \
              --repo "${{ inputs.repo }}" --lines "${{ inputs.lines }}" \
              ${{ inputs.include_forks == false && '--no-forks' || '' }} \
              --outdir docs/data
          fi

      - name: サマリを出力
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          idx = pathlib.Path("docs/data/index.json")
          if not idx.exists():
              print("解析結果がありません"); raise SystemExit
          index = json.loads(idx.read_text())
          docs = {
              e["repo"]: json.loads((idx.parent / e["file"]).read_text())
              for e in index["analyses"]
          }
          print("## 解析結果\n")
          print("| リポジトリ | PR | 衝突ペア | 要rebase |")
          print("|---|---:|---:|---:|")
          for repo, d in docs.items():
              s = d["stats"]
              print(f"| {repo} | {s['prs_total']} | {s['conflict_pairs']} | {s['base_conflicts']} |")
          print("\n### 行動が必要なこと\n")
          for repo, d in docs.items():
              for a in d.get("actions", []):
                  print(f"- **{repo}** — {a['message']}")
          PY

      - name: 解析結果を保存
        uses: actions/cache/save@v4
        with:
          path: docs/data
          key: analysis-${{ github.run_id }}

      - name: アセットにバージョンを打つ
        # デプロイしても古い app.js / styles.css がブラウザに残っていると、
        # 直したはずの挙動が直っていないように見える。実行ごとに変わる
        # クエリを付けて、確実に取り直させる。
        run: |
          V="${{ github.run_id }}"
          sed -i "s|href=\"styles.css\"|href=\"styles.css?v=$V\"|; s|src=\"app.js\"|src=\"app.js?v=$V\"|" docs/index.html
          grep -o 'styles.css?v=[0-9]*' docs/index.html | head -1
          grep -o 'app.js?v=[0-9]*' docs/index.html | head -1

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Pages へデプロイ
        id: deploy
        uses: actions/deploy-pages@v4

      - name: 解析の失敗を報告
        # デプロイを済ませたうえで、失敗があったことは赤で残す
        if: steps.analyze.outcome == 'failure'
        run: |
          echo "::error::一部のリポジトリの解析に失敗しました。" \
               "成功した分はデプロイ済みです。ログを確認してください。"
          exit 1
